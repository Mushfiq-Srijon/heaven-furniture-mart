<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heaven Furniture Mart</title>

  <script>
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#1C2226';
    ctx.fillRect(0, 0, 64, 64);

    // Initials
    ctx.fillStyle = '#B8965A';
    ctx.font = '600 28px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('HF', 32, 33);

    const link = document.createElement('link');
    link.rel = 'icon';
    link.href = canvas.toDataURL();
    document.head.appendChild(link);
  </script>

  <meta name="description"
    content="Heaven Furniture Mart — Chattogram's leading bespoke furniture studio. Custom sofas, beds, dining sets, and office furniture. Designed, crafted, and built around you." />
